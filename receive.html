<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Photo Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Phone page opened from the studio's QR code: one card with status, progress and the finished sheet. */
  :root {
    color-scheme: light;
    --bg: #e8ecef; --panel: #f7f9fa; --fg: #13181c; --muted: #58646e; --line: #ccd4da;
    --accent: #1d5bd6; --accent-fg: #ffffff; --danger: #c22d2d; --ok: #1e7a46; --track: #d8dee3;
    --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1316; --panel: #171c20; --fg: #e6ebee; --muted: #93a0aa; --line: #2a3239;
      --accent: #7aa5ff; --accent-fg: #0a1020; --danger: #ff8078; --ok: #5fd08c; --track: #2a3239;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1316; --panel: #171c20; --fg: #e6ebee; --muted: #93a0aa; --line: #2a3239;
    --accent: #7aa5ff; --accent-fg: #0a1020; --danger: #ff8078; --ok: #5fd08c; --track: #2a3239;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; padding-block: 24px; padding-inline: 16px; }
  .card { max-width: 420px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 0; }
  .status { margin: 0; color: var(--muted); }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); font-weight: 500; }
  .bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
  .pct { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); margin: -6px 0 0; }
  img#sheet { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; }
  a.btn { display: block; text-align: center; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
  .hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <h1>Your photo sheet</h1>
  <p class="status" id="status">Connecting to the studio…</p>
  <div class="bar" id="bar" hidden><i id="fill"></i></div>
  <p class="pct" id="pct" hidden></p>
  <img id="sheet" alt="Your photo sheet" hidden>
  <a class="btn" id="save" hidden>Save to my phone</a>
  <p class="hint" id="hint" hidden>If the file does not save, press and hold the picture and choose Save to Photos or Download image.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const say = (m, cls) => { const s = $('status'); s.textContent = m; s.className = 'status' + (cls ? ' ' + cls : ''); };
  const id = location.hash.slice(1);
  if (!id) { say('Open this page by scanning the QR code at the studio.', 'error'); return; }
  if (!window.Peer) { say('This page needs an internet connection. Check your signal and scan the code again.', 'error'); return; }

  let meta = null, parts = [], got = 0, finished = false, opened = false;
  const peer = new Peer();
  const giveUp = setTimeout(() => { if (!opened) say('Could not connect. Check your signal, or ask the studio to show a new code.', 'error'); }, 20000);

  peer.on('error', (e) => {
    clearTimeout(giveUp);
    if (finished) return;
    say(e.type === 'peer-unavailable' ? 'This code has expired or was already used. Ask the studio to show a new one.' : 'Could not connect to the studio. Check your signal and scan the code again.', 'error');
  });

  peer.on('open', () => {
    const conn = peer.connect(id, { reliable: true, serialization: 'raw' });
    conn.on('open', () => { opened = true; clearTimeout(giveUp); say('Receiving your sheet…'); });
    conn.on('data', (d) => {
      if (typeof d === 'string') {
        meta = JSON.parse(d);
        $('bar').hidden = false; $('pct').hidden = false;
        return;
      }
      parts.push(d); got += d.byteLength;
      if (meta) {
        const p = Math.min(100, Math.round(got / meta.size * 100));
        $('fill').style.width = p + '%'; $('pct').textContent = p + '%  ·  ' + (got / 1048576).toFixed(1) + ' of ' + (meta.size / 1048576).toFixed(1) + ' MB';
        if (got >= meta.size) finish(conn);
      }
    });
    conn.on('close', () => { if (!finished && opened) say('The connection closed before the sheet arrived. Ask the studio to show a new code.', 'error'); });
  });

  function finish(conn) {
    finished = true;
    const url = URL.createObjectURL(new Blob(parts, { type: meta.type }));
    $('sheet').src = url; $('sheet').hidden = false;
    const a = $('save'); a.href = url; a.download = meta.name; a.hidden = false;
    $('hint').hidden = false; $('bar').hidden = true; $('pct').hidden = true;
    say('Done. Your sheet is ready.', 'ok');
    try { conn.send('done'); } catch (e) {}
    setTimeout(() => { try { peer.destroy(); } catch (e) {} }, 1500);
  }
})();
</script>
</body>
</html>
